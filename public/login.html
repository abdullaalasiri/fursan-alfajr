<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>فرسان الفجر - تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFB88C 0%, #E8A0BF 15%, #C8B6E2 35%, #9D84B7 60%, #5B6FA8 85%, #2C3E7C 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(44, 62, 124, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            background: linear-gradient(135deg, #FFB88C, #E8A0BF, #9D84B7, #2C3E7C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .logo p {
            color: #5B6FA8;
            font-size: 14px;
            font-weight: 500;
        }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #9D84B7, #5B6FA8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            border-bottom-color: #9D84B7;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #9D84B7;
            box-shadow: 0 0 0 3px rgba(157, 132, 183, 0.1);
        }
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: white;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #9D84B7;
            box-shadow: 0 0 0 3px rgba(157, 132, 183, 0.1);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #9D84B7 0%, #5B6FA8 50%, #2C3E7C 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        .alert.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }

        /* ========== Mobile Responsive ========== */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 25px;
                border-radius: 15px;
            }
            .logo h1 {
                font-size: 26px;
            }
            .logo p {
                font-size: 13px;
            }
            .tab {
                padding: 12px 10px;
                font-size: 14px;
            }
            input {
                font-size: 15px;
                padding: 11px 13px;
            }
            .btn {
                font-size: 16px;
                padding: 13px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            .logo h1 {
                font-size: 24px;
            }
            .logo p {
                font-size: 12px;
            }
            .tab {
                font-size: 13px;
                padding: 10px 8px;
            }
            label {
                font-size: 14px;
            }
            input {
                font-size: 14px;
                padding: 10px 12px;
            }
            .btn {
                font-size: 15px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🌙 فرسان الفجر</h1>
            <p>نظام تتبع صلاة الفجر</p>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">تسجيل الدخول</div>
            <div class="tab" onclick="switchTab('register')">حساب جديد</div>
        </div>
        <div id="alert" class="alert"></div>
        <div id="registration-closed" class="alert error" style="display: none;">
            🔒 التسجيل مغلق حالياً. يرجى التواصل مع الإدارة.
        </div>
        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn">دخول</button>
            </form>
        </div>
        <div id="register-form" class="form-container">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" name="fullName" required>
                </div>
                <div class="form-group">
                    <label>الفرع</label>
                    <select name="branch" required>
                        <option value="">اختر الفرع</option>
                        <option value="الحد">الحد</option>
                        <option value="الرفاع">الرفاع</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الفئة</label>
                    <select name="category" required>
                        <option value="">اختر الفئة</option>
                        <option value="اعدادي">إعدادي</option>
                        <option value="ثانوي">ثانوي</option>
                        <option value="جامعي">جامعي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور (6 أحرف على الأقل)</label>
                    <input type="password" name="password" minlength="6" required>
                </div>
                <button type="submit" class="btn">إنشاء حساب</button>
            </form>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
                document.getElementById('registration-closed').style.display = 'none';
            } else {
                checkRegistrationStatus();
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
            hideAlert();
        }

        async function checkRegistrationStatus() {
            try {
                const response = await fetch('/api/registration-status');
                const data = await response.json();
                
                const closedMsg = document.getElementById('registration-closed');
                const registerForm = document.getElementById('register-form');
                
                if (!data.isOpen) {
                    closedMsg.style.display = 'block';
                    registerForm.style.opacity = '0.5';
                    registerForm.style.pointerEvents = 'none';
                } else {
                    closedMsg.style.display = 'none';
                    registerForm.style.opacity = '1';
                    registerForm.style.pointerEvents = 'auto';
                }
            } catch (error) {
                console.error('Error checking registration status:', error);
            }
        }
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
        }
        function hideAlert() {
            document.getElementById('alert').style.display = 'none';
        }
        async function handleLogin(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    showAlert(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = data.isAdmin ? '/admin.html' : '/student.html';
                    }, 500);
                } else {
                    showAlert(data.error, 'error');
                }
            } catch (error) {
                showAlert('خطأ في الاتصال بالسيرفر', 'error');
            }
        }
        async function handleRegister(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName: formData.get('fullName'),
                        branch: formData.get('branch'),
                        category: formData.get('category'),
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    showAlert(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/student.html';
                    }, 500);
                } else {
                    showAlert(data.error, 'error');
                }
            } catch (error) {
                showAlert('خطأ في الاتصال بالسيرفر', 'error');
            }
        }
    </script>
</body>
</html>
